name: Generate Scheduled LinkedIn Post

on:
  schedule:
    # 12:00 UTC = 8:00 AM EDT (Mon, Wed, Fri)
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai google-api-python-client google-auth

      - name: Generate Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: python generate_post.py

      - name: Save Draft Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-draft
          path: drafts/latest_post.md

      - name: Send draft to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -c "
          import os, json, urllib.request

          webhook_url = os.environ.get('DISCORD_WEBHOOK_URL')
          if not webhook_url:
              raise ValueError('DISCORD_WEBHOOK_URL secret is not set')

          with open('drafts/latest_post.md', 'r', encoding='utf-8') as f:
              content = f.read().strip()

          payload = {
              'username': 'LinkedIn Content Agent',
              'avatar_url': 'https://cdn-icons-png.flaticon.com/512/174/174857.png',
              'embeds': [
                  {
                      'title': '📝 New Scheduled LinkedIn Post Draft',
                      'description': content[:4000],
                      'color': 3066993,
                      'footer': {
                          'text': 'Automated via GitHub Actions'
                      }
                  }
              ]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'User-Agent': 'GitHub-Actions'}
          )
          urllib.request.urlopen(req)
          "
